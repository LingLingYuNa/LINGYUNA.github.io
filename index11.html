        function closeSellModal() {
            document.getElementById('sell-modal').style.display = 'none';
        }

        // 點擊彈窗背景關閉
        document.getElementById('sell-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSellModal();
            }
        });

        // 儲存售出紀錄
        document.getElementById('sell-confirm-btn').addEventListener('click', function() {
            const orderId = document.getElementById('sell-order-id').value;
            const itemId = document.getElementById('sell-item-id').value;
            
            const qtyInput = document.getElementById('sell-qty');
            const sellQty = parseInt(qtyInput.value, 10);
            const maxRemain = parseInt(qtyInput.dataset.maxRemain, 10);
            const sellPrice = parseFloat(document.getElementById('sell-price').value) || 0;
            
            // 防呆驗證
            if (isNaN(sellQty) || sellQty < 1) {
                alert('請輸入有效的售出數量 (最小為 1)。');
                return;
            }
            if (sellQty > maxRemain) {
                alert(`售出數量 (${sellQty}) 不可大於剩餘庫存 (${maxRemain})！`);
                return;
            }
            
            // 讀取資料
            let records = JSON.parse(localStorage.getItem('records') || '[]');
            const orderIndex = records.findIndex(r => r.id === orderId);
            
            if (orderIndex > -1) {
                const itemIndex = records[orderIndex].items.findIndex(i => i.itemId === itemId);
                
                if (itemIndex > -1) {
                    // 建立新的 sale 物件
                    const newSale = {
                        saleId: 'sale_' + Date.now(),
                        date: document.getElementById('sell-date').value,
                        soldQuantity: sellQty,
                        soldPriceTwd: sellPrice,
                        buyerId: document.getElementById('sell-buyer').value.trim(),
                        isPaid: document.getElementById('sell-is-paid').checked
                    };
                    
                    // 確保 sales 陣列存在
                    if (!records[orderIndex].items[itemIndex].sales) {
                        records[orderIndex].items[itemIndex].sales = [];
                    }
                    
                    // 加入新紀錄
                    records[orderIndex].items[itemIndex].sales.push(newSale);
                    
                    // 存回 LocalStorage
                    localStorage.setItem('records', JSON.stringify(records));
                    
                    // 關閉彈窗並重新渲染畫面
                    closeSellModal();
                    alert('售出紀錄已儲存！');
                    renderHistory(); // 更新庫存顯示
                }
            }
        });

        // ==========================
        // 報表模組邏輯
        // ==========================
        const budgetInput = document.getElementById('monthly-budget-input');
        const fixedInput = document.getElementById('monthly-fixed-input');

        let expenseChart = null; // 全域變數，用來存放 Chart 實例
        function renderReport() {
            // 1. 取得當前月份 (YYYY-MM)
            const currentMonthStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
            
            // 2. 讀取並過濾當月紀錄
            const records = JSON.parse(localStorage.getItem('records') || '[]');
            const monthlyRecords = records.filter(r => r.date.startsWith(currentMonthStr));
            
            // 3. 計算本月總花費與標籤統計
            let totalSpent = 0;
            const tagCosts = {};
            
            monthlyRecords.forEach(record => {
                if (record.type === 'life') {
                    const amount = record.amountTwd || 0;
                    totalSpent += amount;
                    
                    // 計算標籤花費
                    const tags = (record.tags && record.tags.length > 0) ? record.tags : ['未分類'];
                    const amountPerTag = amount / tags.length;
                    
                    tags.forEach(tag => {
                        tagCosts[tag] = (tagCosts[tag] || 0) + amountPerTag;
                    });
                    
                } else if (record.type === 'merch') {
                    // 計算該訂單總購買成本 (外幣)
                    let orderTotalCost = 0;
                    record.items.forEach(item => {
                        orderTotalCost += item.foreignPrice * item.quantity;
                    });
                    
                    const orderTwdCost = orderTotalCost * record.exchangeRate;
                    const orderNetCost = orderTwdCost + record.globalShippingTwd + record.globalDiscountTwd;
                    
                    let monthlyRecovered = 0;
                    
                    record.items.forEach(item => {
                        // 1) 該物品本月的回血金額
                        let itemMonthlyRecovered = 0;
                        if (item.sales && item.sales.length > 0) {
                            item.sales.forEach(sale => {
                                if (sale.date.startsWith(currentMonthStr)) {
                                    itemMonthlyRecovered += (sale.soldQuantity * sale.soldPriceTwd);
                                }
                            });
                        }
                        monthlyRecovered += itemMonthlyRecovered;
                        
                        // 2) 該物品在訂單中的分攤成本 (台幣)
                        let singleItemExtra = 0;
                        if (record.splitMethod === 'count') {
                            const totalQty = record.items.reduce((sum, i) => sum + i.quantity, 0);
                            if (totalQty > 0) {
                                singleItemExtra = ((record.globalShippingTwd + record.globalDiscountTwd) / totalQty) * item.quantity;
                            }
                        } else {
                            if (orderTwdCost > 0) {
                                singleItemExtra = (record.globalShippingTwd + record.globalDiscountTwd) * ((item.foreignPrice * item.quantity * record.exchangeRate) / orderTwdCost);
                            }
                        }
                        const singleItemNetCost = (item.foreignPrice * item.quantity * record.exchangeRate) + singleItemExtra;
                        
                        // 3) 淨花費 = 分攤成本 - 回血金額
                        const finalItemCost = singleItemNetCost - itemMonthlyRecovered;
                        
                        // 4) 平均分配到標籤上
                        const tags = (item.tags && item.tags.length > 0) ? item.tags : ['未分類'];
                        const amountPerTag = finalItemCost / tags.length;
                        
                        tags.forEach(tag => {
                            tagCosts[tag] = (tagCosts[tag] || 0) + amountPerTag;
                        });
                    });
                    
                    totalSpent += (orderNetCost - monthlyRecovered);
                }
            });
            
            // 更新花費顯示 (取整數)
            totalSpent = Math.round(totalSpent);
            document.getElementById('report-total-spent').textContent = `NT$ ${totalSpent.toLocaleString()}`;
            
            // 4. 預算進度條邏輯
            updateBudgetProgress(totalSpent);
            
            // 5. 繪製圖表
            renderPieChart(tagCosts);
        }

        function renderPieChart(tagCosts) {
            // 將 tagCosts 轉換為陣列並過濾花費小於等於 0 的標籤
            const costArray = Object.keys(tagCosts)
                .map(key => ({ tag: key, cost: tagCosts[key] }))
                .filter(item => item.cost > 0);
                
            // 降冪排序
            costArray.sort((a, b) => b.cost - a.cost);
            
            const labels = [];
            const data = [];
            let otherCost = 0;
            const TOP_N = 5;
            
            costArray.forEach((item, index) => {
                if (index < TOP_N) {
                    labels.push(item.tag);
                    data.push(Math.round(item.cost));
                } else {
                    otherCost += item.cost;
                }
            });
            
            if (otherCost > 0) {
                labels.push('其他');
                data.push(Math.round(otherCost));
            }

            const ctx = document.getElementById('expense-pie-chart');
            
            // 繪製前清除舊圖表
            if (expenseChart) {
                expenseChart.destroy();
            }
            
            // 若無資料，繪製空圖提示
            if (data.length === 0) {
                expenseChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['無花費紀錄'],
                        datasets: [{
                            data: [1],
                            backgroundColor: ['#E0E0E0']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { tooltip: { enabled: false } }
                    }
                });
                return;
            }

            // 自訂背景顏色陣列
            const bgColors = [
                '#4A90E2', '#50E3C2', '#F5A623', '#F8E71C', '#D0021B', '#8B572A', '#B8E986', '#9013FE'
            ];
            
            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: bgColors.slice(0, data.length),
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: {
                                    family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateBudgetProgress(totalSpent) {
            const budget = parseFloat(budgetInput.value) || 0;
            const fixedExpense = parseFloat(fixedInput.value) || 0;
            const progressFill = document.getElementById('budget-progress-fill');
            const remainText = document.getElementById('budget-remain-text');
            const safeText = document.getElementById('budget-safe-to-spend');
            
            if (budget <= 0) {
                progressFill.style.width = '0%';
                progressFill.classList.remove('progress-danger');
                remainText.textContent = '尚未設定有效預算';
                if (safeText) safeText.textContent = '安全吃谷金：NT$ 0';
                return;
            }
            
            let percentage = (totalSpent / budget) * 100;
            if (percentage > 100) percentage = 100;
            
            progressFill.style.width = `${percentage}%`;
            
            if (totalSpent >= budget) {
                progressFill.classList.add('progress-danger');
                const overspent = totalSpent - budget;
                remainText.innerHTML = `已超支 <span style="color: var(--danger-color); font-weight: bold;">NT$ ${overspent.toLocaleString()}</span>`;
            } else {
                progressFill.classList.remove('progress-danger');
                const remaining = budget - totalSpent;
                remainText.innerHTML = `剩餘可用預算 <span style="color: var(--primary-color); font-weight: bold;">NT$ ${remaining.toLocaleString()}</span>`;
            }

            // 計算安全吃谷金
            const safeToSpend = budget - fixedExpense - totalSpent;
            if (safeText) {
                if (safeToSpend < 0) {
                    safeText.style.color = 'var(--danger-color)';
                    safeText.textContent = `安全吃谷金：NT$ ${safeToSpend.toLocaleString()}`;
                } else {
                    safeText.style.color = 'var(--primary-color)';
                    safeText.textContent = `安全吃谷金：NT$ ${safeToSpend.toLocaleString()}`;
                }
            }
        }

        // 綁定預算輸入事件，即時更新進度條
        [budgetInput, fixedInput].forEach(input => {
            if (!input) return;
            input.addEventListener('input', () => {
                // 重新取得 totalSpent (從畫面上抓取數字)
                const spentText = document.getElementById('report-total-spent').textContent;
                const spentNum = parseInt(spentText.replace(/[^0-9-]/g, '')) || 0;
                updateBudgetProgress(spentNum);
            });
            input.addEventListener('change', () => {
                const spentText = document.getElementById('report-total-spent').textContent;
                const spentNum = parseInt(spentText.replace(/[^0-9-]/g, '')) || 0;
                updateBudgetProgress(spentNum);
            });
        });

        // ==========================
        // 設定與備份模組邏輯
        // ==========================
        document.getElementById('btn-export').addEventListener('click', exportData);
        document.getElementById('btn-clear-all').addEventListener('click', clearAllData);

        function exportData() {
            const records = JSON.parse(localStorage.getItem('records') || '[]');
            if (records.length === 0) {
                alert('目前沒有資料可供匯出');
                return;
            }

            const jsonStr = JSON.stringify(records, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            // 產生包含當日日期的檔名 (YYYYMMDD)
            const d = new Date();
            const dateString = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
            const filename = `CollectTrack_Backup_${dateString}.json`;

            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename;
            
            document.body.appendChild(a);
            a.click();
            
            // 釋放記憶體
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }

        function clearAllData() {
            const confirm1 = confirm('警告：這將會永久刪除所有紀錄！強烈建議先進行匯出備份。確定要繼續嗎？');
            if (confirm1) {
                const confirm2 = confirm('資料刪除後將無法恢復！最後確認是否清空？');
                if (confirm2) {
                    localStorage.removeItem('records');
                    alert('資料已清空');
                    location.reload();
                }
            }
        }

        document.getElementById('import-file').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsedData = JSON.parse(e.target.result);
                    if (!Array.isArray(parsedData)) {
                        alert('檔案格式錯誤，請確保上傳的是 CollectTrack 產生的 JSON 備份檔。');
                        return;
                    }
                    
                    const confirmImport = confirm('即將匯入資料。警告：這將會【覆蓋】您目前瀏覽器中的所有紀錄！確定要匯入嗎？');
                    if (confirmImport) {
                        localStorage.setItem('records', JSON.stringify(parsedData));
                        alert('還原成功！系統將重新載入。');
                        location.reload();
                    }
                } catch (error) {
                    alert('檔案格式錯誤，無法解析 JSON 內容。');
                    console.error(error);
                } finally {
                    // 清空 input 的值，以便下次能選擇同一個檔案
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        });

        // ==========================
        // 彈窗下滑關閉 (Swipe Down to Close)
        // ==========================
        const modalContents = document.querySelectorAll('.modal-content');
        
        modalContents.forEach(modal => {
            let startY = 0;
            let currentY = 0;
            let isDraggingModal = false;

            modal.addEventListener('touchstart', (e) => {
                // 如果內部元素正在滾動 (例如下拉清單還沒到頂)，則不觸發下滑關閉
                if (modal.scrollTop > 0) return;

                startY = e.touches[0].clientY;
                isDraggingModal = true;
                modal.style.transition = 'none'; // 拖曳時移除過場動畫
            }, { passive: true });

            modal.addEventListener('touchmove', (e) => {
                if (!isDraggingModal) return;

                const y = e.touches[0].clientY;
                const deltaY = y - startY;

                // 只有向下滑動時才跟著動 (deltaY > 0)
                if (deltaY > 0) {
                    currentY = deltaY;
                    modal.style.transform = `translateY(${currentY}px)`;
                    
                    // 防止觸發預設的滾動或橡皮筋效應
                    if (e.cancelable) {
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            modal.addEventListener('touchend', (e) => {
                if (!isDraggingModal) return;
                isDraggingModal = false;
                
                modal.style.transition = 'transform 0.3s ease-out';

                // 如果向下滑動超過 100px，則關閉彈窗
                if (currentY > 100) {
                    modal.style.transform = 'translateY(100%)'; // 先滑出畫面
                    
                    // 等待過場動畫結束後，隱藏外層 overlay 並清除行內樣式
                    setTimeout(() => {
                        const overlay = modal.closest('.modal-overlay');
                        if (overlay) {
                            overlay.style.display = 'none';
                        }
                        modal.style.transform = ''; // 清除 transform
                        currentY = 0;

                        // 嘗試清空輸入框 (若需要)
                        const inputs = modal.querySelectorAll('input[type="text"], input[type="number"], input[type="hidden"]');
                        inputs.forEach(input => {
                            // 保留可能有的預設值，這裡可依需求調整，例如：
                            // if (input.id !== 'sell-qty') input.value = '';
                        });
                    }, 300);
                } else {
                    // 距離不夠，彈回原位
                    modal.style.transform = 'translateY(0)';
                    currentY = 0;
                    
                    // 動畫結束後清除 inline style
                    setTimeout(() => {
                        if (!isDraggingModal) {
                            modal.style.transform = '';
                        }
                    }, 300);
                }
            });
        });

    </script>
</body>
